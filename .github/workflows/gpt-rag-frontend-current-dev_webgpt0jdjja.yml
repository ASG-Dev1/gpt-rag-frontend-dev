name: Build and deploy Python backend with frontend assets to Azure Web App - webgpt0jdjja

on:
  push:
    branches:
      - gpt-rag-frontend-CURRENT-DEV
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # Backend setup
      - name: Set up Python version
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Create virtual environment and install backend dependencies
        run: |
          echo 'Creating Python virtual environment "backend/backend_env"'
          python3 -m venv backend/backend_env
          echo ""
          echo "Restoring backend python packages"
          echo ""
          cd backend
          ./backend_env/bin/python3 -m pip install -r requirements.txt
        if: success()  # Continue only if successful

      # Frontend setup
      - name: Install frontend dependencies
        run: |
          echo ""
          echo "Restoring frontend npm packages"
          echo ""
          cd frontend
          npm install
        if: success()

      - name: Build frontend
        run: |
          echo ""
          echo "Building frontend"
          echo ""
          cd frontend
          npm run build
        if: success()

      - name: Zip artifact for deployment
        run: |
          zip release.zip -r backend frontend
        if: success()

      - name: Upload artifact for deployment jobs
        uses: actions/upload-artifact@v4
        with:
          name: full-app
          path: |
            release.zip

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: 'Production'
      url: ${{ steps.deploy-to-webapp.outputs.webapp-url }}
    permissions:
      id-token: write  # Required for requesting the JWT

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: full-app

      - name: Unzip artifact for deployment
        run: unzip release.zip

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID }}

      - name: 'Deploy to Azure Web App'
        uses: azure/webapps-deploy@v3
        id: deploy-to-webapp
        with:
          app-name: 'webgpt0jdjja'
          slot-name: 'Production'
